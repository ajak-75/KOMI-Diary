<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KOMI-Diary · 375px check frame</title>
<style>
  html, body { margin: 0; background: #d9dde1; color: #333; font: 12px/1.4 system-ui, sans-serif; }
  .wrap { display: flex; gap: 24px; padding: 20px; align-items: flex-start; }
  .phone { width: 375px; height: 812px; border: 0; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .note { max-width: 320px }
</style>
</head>
<body>
<div class="wrap">
  <iframe class="phone" id="frame" title="KOMI-Diary at 375px" src="./"></iframe>
  <div class="note">
    <b>375px check frame</b>
    <p>Opens the app at a 375&times;812 mobile viewport. Pass a language, e.g. <code>?lang=fr</code>, <code>?lang=ar</code>, <code>?lang=nl</code>. This page is temporary and is removed after the review.</p>
  </div>
</div>
<script>
  var q = location.search || '';
  document.getElementById('frame').src = './' + q;
</script>
</body>
</html>
